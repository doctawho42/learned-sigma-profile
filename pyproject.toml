[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgnn-solv"
version = "1.0.0"
description = "Reproduction package for the diagnosis of a learned sigma-profile in a physics-embedded solubility model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Nikita L. Polomoshnov", email = "nikitapol@fbb.msu.ru" },
    { name = "Anastasiya V. Rudik" },
]
keywords = [
    "solubility",
    "COSMO-SAC",
    "physics-informed machine learning",
    "sigma profile",
    "graph neural network",
]

# Versions the deposited results were computed with are pinned in requirements-lock.txt.
# The bounds here are the oldest releases the code is known to work against.
dependencies = [
    "torch>=2.0",
    "torch-geometric>=2.4",
    "rdkit>=2022.09",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "requests>=2.28",
    "tqdm>=4.64",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.urls]
Archive = "https://doi.org/10.5281/zenodo.23907893"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
